<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spendr" />
    <!-- The tab icon can keep its transparency; the home-screen one cannot.
         iOS composites an apple-touch-icon's alpha onto BLACK, so a
         transparent logo installs as a black tile - apple-touch-icon.png is
         flattened onto white for exactly that reason, and iOS rounds the
         corners itself. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="dns-prefetch" href="https://supabase.co" />
    <!-- No font link: Inter is bundled with the app now (see src/main.jsx),
         so opening Spendr no longer asks Google for anything. -->
    <title>Spendr</title>
    <script>
      (function(){
        try {
          var t=localStorage.getItem('spendr-theme')||'dark';
          var a=localStorage.getItem('accentColor')||'#2D9DFF';
          var f=localStorage.getItem('spendr-style')==='flat';
          var d=document.documentElement;
          // Apply theme class immediately so dark: variants work on first paint
          if(t==='dark') d.classList.add('dark');
          // The clean style, likewise - lights out has to be black from the first frame
          if(f) d.classList.add('flat');
          // Reduce motion, from Preferences - before anything has a chance to move
          if(localStorage.getItem('spendr-reduce-motion')==='1') d.classList.add('reduce-motion');
          // Set background so there's no white flash while JS is parsing
          d.style.background=t==='dark'?(f?'#000000':'#0b0f14'):(f?'#f2f2f7':'#f8fafc');
          // Apply accent color
          var h=a.replace('#','');
          var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
          d.style.setProperty('--color-primary',a);
          d.style.setProperty('--color-primary-rgb',r+','+g+','+b);
          // The text on it: white, or ink on a pale accent (ThemeContext's onAccent)
          var lin=function(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
          var L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
          d.style.setProperty('--color-on-primary',1.05/(L+0.05)>=2.5?'#ffffff':'#0f172a');
          d.classList.add(a==='#2D9DFF'?'accent-blue':'accent-custom');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
